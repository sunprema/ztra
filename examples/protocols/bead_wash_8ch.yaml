# The bead wash again, with the 8-channel pipette: eight samples in column 1 of the
# deep-well plate, three rounds, every step one column at a time. Same physics as the
# single-channel version — every well is still checked on its own — a quarter of the
# robot moves, and a column of tips per pickup.
#
# Try:   ztra compile examples/world examples/protocols/bead_wash_8ch.yaml --budget "sensor=scale_2,every=2"
version: 1
name: bead_wash_three_rounds_8ch
steps:
  - op: for_each
    as: round
    items:
      - { supernatant_ul: 260 }   # 80 uL of the original liquid + 180 uL of buffer
      - { supernatant_ul: 180 }
      - { supernatant_ul: 180 }
    body:
      # 1. wash buffer onto the column from above, one clean column of tips
      - op: with_tip
        body:
          - op: transfer
            from: { plate: RES1, well: A1 }
            to: { plate: P2, column: 1 }
            volume_ul: 180
            dispense: { at: top, offset_mm: -2, blow_out: true }

      # 2. resuspend, with the column's own tips (kept for step 4)
      - op: with_tip
        name: tips_col1
        body:
          - { op: mix, at: { plate: P2, column: 1 }, volume_ul: 100, repetitions: 5 }

      # 3. pellet
      - { op: engage_magnet, module: MAG1, height_mm: 6.5 }
      - { op: delay, minutes: 3 }

      # 4. supernatant to waste, gently, off the pellet, with an air gap
      - op: with_tip
        name: tips_col1
        body:
          - op: transfer
            from: { plate: P2, column: 1 }
            to: { plate: WASTE, well: A1 }
            volume_ul: $round.supernatant_ul
            aspirate: { offset_mm: 0.5, side_mm: -1, rate_ul_s: 20 }
            dispense: { at: top, offset_mm: -3, blow_out: true }
            air_gap_ul: 10

      - { op: disengage_magnet, module: MAG1 }
