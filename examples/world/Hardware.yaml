# What can act and observe. The labware catalog is the source of CON-2; the
# sensor model is CON-5 (sigma values here are placeholders until measured).
version: 1

robot:
  vendor: opentrons
  model: ot2
  api_level: "2.16"

pipettes:
  - name: p300_single_gen2
    mount: right
    channels: 1
    min_ul: 20
    max_ul: 300
    tip_labware: [opentrons_96_tiprack_300ul]
    accuracy: { systematic_pct: 2.0, random_pct: 1.0, random_ul: 0.5 }   # placeholder until measured

labware:
  corning_96_wellplate_360ul_flat:
    kind: plate
    rows: 8
    cols: 12
    well_max_ul: 360
    height_mm: 14.2
    well_depth_mm: 10.67
    well_diameter_mm: 6.86
  opentrons_24_tuberack_nest_1.5ml_snapcap:
    kind: tube_rack
    rows: 4
    cols: 6
    well_max_ul: 1500
    height_mm: 43.0
    well_depth_mm: 37.9
    well_diameter_mm: 10.2
  nest_12_reservoir_15ml:
    kind: reservoir
    rows: 1
    cols: 12
    well_max_ul: 15000
    height_mm: 31.4
    well_depth_mm: 26.85
    well_diameter_mm: 8.2
  nest_1_reservoir_195ml:
    kind: reservoir
    rows: 1
    cols: 1
    well_max_ul: 195000
    height_mm: 31.4
    well_depth_mm: 25.0
    well_diameter_mm: 71.2
  opentrons_96_tiprack_300ul:
    kind: tip_rack
    rows: 8
    cols: 12
    tip_volume_ul: 300
    height_mm: 64.7

sensors:
  scale_1:
    kind: plate_mass
    observes: { entity: P1 }
    sigma: 0.5
    unit: mg
    read_time_s: 5
  camera_1:
    kind: well_volume
    observes: { entity: P1, columns: [1] }
    sigma: 5
    unit: uL
    read_time_s: 2

safe_envelope:
  temperature_c: { min: 4, max: 40 }
  max_flow_rate_ul_s: 300
