# What exists. Reagents carry an MSDS hazard class (CON-3); vials are linear
# resources (FR-1.3); plates list only non-empty wells.
version: 1

reagents:
  water:
    hazard: inert
  hcl_1m:
    hazard: acid
    concentration: "1 M"
    msds: "msds/hcl.pdf"
  naoh_1m:
    hazard: base
    concentration: "1 M"
    msds: "msds/naoh.pdf"
  enzyme_x:
    hazard: inert
    concentration: "10 U/uL"
  wash_buffer:
    hazard: inert
  beads:
    hazard: inert
    magnetic: true            # pellets on the magnetic module; stays behind when supernatant is drawn

vials:
  V_water:
    reagent: water
    volume_ul: 1000
  V_hcl:
    reagent: hcl_1m
    volume_ul: 200
  V_naoh:
    reagent: naoh_1m
    volume_ul: 200
  V_enzyme:
    reagent: enzyme_x
    volume_ul: 150
    state: frozen
    freeze_thaw_cycles: 1

plates:
  P1:
    labware: corning_96_wellplate_360ul_flat
    wells:
      A1:
        - { reagent: water, volume_ul: 50 }
  P2:                         # a deep-well plate on the magnetic module; four bead suspensions
    labware: nest_96_wellplate_2ml_deep
    wells:
      A1: [ { reagent: beads, volume_ul: 20 }, { reagent: water, volume_ul: 80 } ]
      B1: [ { reagent: beads, volume_ul: 20 }, { reagent: water, volume_ul: 80 } ]
      C1: [ { reagent: beads, volume_ul: 20 }, { reagent: water, volume_ul: 80 } ]
      D1: [ { reagent: beads, volume_ul: 20 }, { reagent: water, volume_ul: 80 } ]
      E1: [ { reagent: beads, volume_ul: 20 }, { reagent: water, volume_ul: 80 } ]
      F1: [ { reagent: beads, volume_ul: 20 }, { reagent: water, volume_ul: 80 } ]
      G1: [ { reagent: beads, volume_ul: 20 }, { reagent: water, volume_ul: 80 } ]
      H1: [ { reagent: beads, volume_ul: 20 }, { reagent: water, volume_ul: 80 } ]
  RES1:                       # a 12-channel trough of wash buffer, addressed like a 1x12 plate
    labware: nest_12_reservoir_15ml
    wells:
      A1:
        - { reagent: wash_buffer, volume_ul: 12000 }
  WASTE:                      # liquid waste: receives anything, gives nothing back
    labware: nest_1_reservoir_195ml
    waste: true
