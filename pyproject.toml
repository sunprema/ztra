[project]
name = "ztra"
version = "0.1.0"
description = "ztra core: world model, compiler, lowering, backends"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = ["pytest>=8", "mypy>=1.10", "types-PyYAML", "mcp>=2,<3"]

[project.scripts]
ztra = "ztra.cli:main"
ztra-mcp = "ztra.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ztra"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/ztra"]
